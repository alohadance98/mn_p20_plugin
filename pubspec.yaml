name: mn_p20_plugin
description: "Flutter plugin for the Magnetic North P20 vehicle terminal SDK (P20 hardware, MDVR host, LED signs, fuel sensor). Android only."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.mn.plugin
        pluginClass: MnP20Plugin
